input {
  jdbc {
    jdbc_driver_library => "/opt/homebrew/Cellar/logstash/9.2.1/libexec/mysql-connector/mysql-connector-j-8.0.33.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://localhost:3307/small_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true"
    jdbc_user => "root"
    jdbc_password => "root"

    statement => "
      SELECT
        p.product_id,
        p.name,
        p.brand,
        p.description,
        p.base_price,
        p.discount_rate,
        CAST(p.base_price * (1 - p.discount_rate / 100) AS SIGNED) AS final_price,
        p.shipping_price,
        p.status,
        p.image_url,
        p.user_id AS seller_id,
        p.created_at,
        p.updated_at,
        c.category_id,
        c.name AS category_name,
        c.parent_id,
        c.depth,
        -- 리뷰 평균
        COALESCE((
          SELECT AVG(r.rating)
          FROM products_reviews r
          WHERE r.product_id = p.product_id
        ), 0) AS avg_rating,
        -- 리뷰 개수
        COALESCE((
          SELECT COUNT(*)
          FROM products_reviews r
          WHERE r.product_id = p.product_id
        ), 0) AS review_count
      FROM products p
      LEFT JOIN product_category c ON p.category_id = c.category_id
      WHERE p.product_id > :sql_last_value
      ORDER BY p.product_id ASC
    "

    jdbc_paging_enabled => true
    jdbc_page_size => 1000

    use_column_value => true
    tracking_column => "product_id"
    tracking_column_type => "numeric"

    last_run_metadata_path => "/opt/homebrew/Cellar/logstash/9.2.1/libexec/data/.logstash_jdbc_last_run"
  }
}

filter {

  # 1) 먼저 metadata id 생성
  mutate {
    add_field => {
      "[@metadata][id]" => "%{product_id}"
    }
  }

  # 2) 이후 product_id를 rename
  mutate {
    rename => {
      "product_id" => "productId"
      "seller_id" => "sellerId"
      "base_price" => "basePrice"
      "discount_rate" => "discountRate"
      "final_price" => "finalPrice"
      "shipping_price" => "shippingPrice"
      "image_url" => "imageUrl"
      "created_at" => "createdAt"
      "updated_at" => "updatedAt"
      "avg_rating" => "avgRating"
      "review_count" => "reviewCount"
    }
  }

  # 3) category 필드 처리
  mutate {
    add_field => {
      "[category][id]" => "%{category_id}"
      "[category][name]" => "%{category_name}"
      "[category][parentId]" => "%{parent_id}"
      "[category][depth]" => "%{depth}"
      "[category][fullPath]" => "%{category_name}"
    }
    remove_field => ["category_id", "category_name", "parent_id", "depth", "@version", "@timestamp"]
  }

  # 4) date 변환
  date {
    match => ["createdAt", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "createdAt"
    timezone => "Asia/Seoul"
  }

  date {
    match => ["updatedAt", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "updatedAt"
    timezone => "Asia/Seoul"
  }

  # 5) 타입 변환
  mutate {
    convert => {
      "basePrice" => "integer"
      "discountRate" => "float"
      "finalPrice" => "integer"
      "shippingPrice" => "integer"
      "avgRating" => "float"
      "reviewCount" => "integer"
      "[category][id]" => "integer"
      "[category][parentId]" => "integer"
      "[category][depth]" => "integer"
    }
  }

}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "products"
    document_id => "%{[@metadata][id]}"
  }

  stdout {
    codec => dots
  }
}