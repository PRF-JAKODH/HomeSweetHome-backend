input {
  jdbc {
    jdbc_connection_string => "jdbc:mysql://localhost:3307/small_db?useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    jdbc_user => "root"
    jdbc_password => "root"

    jdbc_driver_library => "/Users/junnukim1007gmail.com/IdeaProjects/homesweet-back/logstash/mysql-connector-java-8.0.28.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

    jdbc_fetch_size => 1000
    jdbc_page_size  => 1000

    use_column_value => true
    tracking_column  => "product_id"
    record_last_run  => true
    last_run_metadata_path => "/Users/junnukim1007gmail.com/IdeaProjects/homesweet-back/logstash/.logstash_jdbc_last_run"

    statement => "
      SELECT
          p.product_id,
          p.category_id,
          p.user_id AS seller_id,
          p.name,
          p.image_url,
          p.brand,
          p.base_price,
          p.discount_rate,
          p.shipping_price,
          p.status,
          p.description,
          c.name AS category_name,

          (SELECT COALESCE(AVG(r.rating), 0)
           FROM products_reviews r
           WHERE r.product_id = p.product_id) AS average_rating,

          (SELECT COALESCE(COUNT(r2.review_id), 0)
           FROM products_reviews r2
           WHERE r2.product_id = p.product_id) AS review_count,

          (SELECT
              JSON_ARRAYAGG(
                JSON_OBJECT(
                  'group_name', og.group_name,
                  'values', (
                    SELECT JSON_ARRAYAGG(v.value_name)
                    FROM product_option_value v
                    WHERE v.option_group_id = og.option_group_id
                  )
                )
              )
           FROM product_option_group og
           WHERE og.product_id = p.product_id
          ) AS option_groups,

          p.created_at,
          p.updated_at

      FROM products p
      JOIN product_category c
        ON p.category_id = c.category_id
      WHERE p.product_id > :sql_last_value
      ORDER BY p.product_id
      LIMIT 100000
    "

    schedule => "*/30 * * * * *"
  }
}

filter {
  mutate {
    convert => {
      "product_id"      => "integer"
      "category_id"     => "integer"
      "seller_id"       => "integer"
      "base_price"      => "integer"
      "shipping_price"  => "integer"
      "discount_rate"   => "float"
      "average_rating"  => "float"
      "review_count"    => "integer"
    }
  }

  # sale_price 계산
  ruby {
    code => "
      if event.get('base_price') && event.get('discount_rate')
        base = event.get('base_price').to_i
        rate = event.get('discount_rate').to_f / 100.0
        sale = base - (base * rate)
        event.set('sale_price', sale.to_i)
      end
    "
  }

  # 옵션 groups JSON → Ruby Hash 변환
  json {
    source => "option_groups"
    target => "option_groups"
  }

  mutate {
    remove_field => ["@version", "@timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "products"
    document_id => "%{product_id}"
  }

  stdout {
    codec => json_lines
  }
}