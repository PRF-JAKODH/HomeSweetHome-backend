input {
  jdbc {
    jdbc_connection_string => "jdbc:mysql://localhost:3307/small_db?useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    jdbc_user => "root"
    jdbc_password => "root"

    jdbc_driver_library => "/Users/junnukim1007gmail.com/IdeaProjects/homesweet-back/logstash/mysql-connector-java-8.0.28.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

    jdbc_fetch_size  => 1000
    jdbc_page_size   => 1000

    use_column_value => true
    tracking_column  => "post_id"
    record_last_run  => true
    last_run_metadata_path => "/Users/junnukim1007gmail.com/IdeaProjects/homesweet-back/logstash/.logstash_community_last_run"

    statement => "
      SELECT
          cp.post_id AS post_id,
          cp.title AS title,
          cp.content AS content,
          cp.category AS category,
          cp.user_id AS author_id,
          cp.view_count AS view_count,
          cp.like_count AS like_count,
          cp.comment_count AS comment_count,
          cp.is_deleted AS is_deleted,
          cp.created_at AS created_at
      FROM community_posts cp
      WHERE cp.post_id > :sql_last_value
      ORDER BY cp.post_id
      LIMIT 100000
    "

    # 매 30초마다 실행
    schedule => "*/30 * * * * *"
  }
}

filter {

  # type 변환
  mutate {
    convert => {
      "post_id"       => "integer"
      "author_id"     => "integer"
      "view_count"    => "integer"
      "like_count"    => "integer"
      "comment_count" => "integer"
      "is_deleted"    => "boolean"
    }
  }

  # 불필요한 필드 제거
  mutate {
    remove_field => ["@version", "@timestamp"]
  }
}

output {

  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "community_posts"
    document_id => "%{post_id}"
  }

  stdout { codec => json_lines }
}