auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Rate Limit 설정 (대폭 증가)
limits_config:
  ingestion_rate_mb: 100            # 기본 4MB -> 100MB
  ingestion_burst_size_mb: 200      # 기본 6MB -> 200MB
  per_stream_rate_limit: 100MB      # 스트림당 제한 증가
  per_stream_rate_limit_burst: 200MB
  max_streams_per_user: 10000       # 최대 스트림 수 증가
  max_entries_limit_per_query: 10000 # 쿼리당 최대 엔트리 수 증가
  reject_old_samples: false         # 오래된 샘플 허용

compactor:
  working_directory: /loki/boltdb-shipper-compactor
  shared_store: filesystem
