test:
  mode: true  # 부하 테스트 시 true, 프로덕션에서는 false

spring:
  application:
    name: homesweet-back
  profiles:
    active:
      - dev
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  datasource:
    hikari:
      maximum-pool-size: 30       # 100 → 30 (MySQL 2 vCPU 고려)
      minimum-idle: 10            # 50 → 10
      idle-timeout: 300000
      max-lifetime: 1200000       # 20분 (30분 → 20분)
      connection-timeout: 10000   # 20초 → 10초 (빠른 실패)
      leak-detection-threshold: 60000

server:
  tomcat:
    threads:
      max: 400                    # 350 → 400 워커 스레드 증가
      min-spare: 100              # 50 → 100 웜업 시간 단축
    accept-count: 300             # 200 → 300 연결 대기큐 증가
    max-connections: 10000
    connection-timeout: 20000     # 30000 → 20000
  compression:
    enabled: true                 # Gzip 압축 활성화
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024       # 1KB 이상만 압축


resilience4j:
  circuitbreaker:
    instances:
      toss-payments:
        registerHealthIndicator: true
        slidingWindowSize: 5           # 최근 5번 요청을 기록
        failureRateThreshold: 50       # 그 중 50%(즉 3번) 이상 실패하면 서킷 OPEN (차단)
        waitDurationInOpenState: 10s   # 차단 후 10초 동안은 무조건 요청 거부 (쉬는 시간)
        permittedNumberOfCallsInHalfOpenState: 3 # 10초 뒤 '반열림' 상태에서 3번만 테스트로 찔러봄
        automaticTransitionFromOpenToHalfOpenEnabled: true # 시간이 지나면 자동으로 반열림 상태로 전환

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers # health와 circuitbreakers 정보를 공개
  endpoint:
    health:
      show-details: always # 상세 정보 표시
  health:
    circuitbreakers:
      enabled: true # 서킷 브레이커 상태도 health에 포함

retry:
  instances:
    toss-payments-retry: # 재시도 설정 이름
      maxRetryAttempts: 3        # 최대 3번까지 시도 (최초 1회 + 재시도 2회)
      waitDuration: 500ms        # 재시도 사이의 간격 (0.5초)
      retryExceptions:           # 재시도할 예외 타입 (모든 에러를 다 재시도하진 않음)
        - java.io.IOException    # 네트워크 연결 오류
        - org.springframework.web.client.ResourceAccessException # 타임아웃 등
        - java.net.ConnectException
      # (옵션) 400 Bad Request 같은 건 재시도해도 소용없으니 제외
      ignoreExceptions:
        - org.springframework.web.client.HttpClientErrorException