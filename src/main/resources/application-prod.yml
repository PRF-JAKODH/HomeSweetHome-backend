spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/homesweet}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME:homesweet}
    password: ${DATABASE_PASSWORD:homesweet}
    hikari:
      # 커넥션 풀 크기 설정
      minimum-idle: ${DATABASE_MINIMUM_IDLE:5}              # 최소 유휴 커넥션 수
      maximum-pool-size: ${DATABASE_MAXIMUM_POOL_SIZE:10}   # 최대 커넥션 풀 크기
      # 타임아웃 설정
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}  # 커넥션 획득 대기 시간 (30초)
      idle-timeout: ${DATABASE_IDLE_TIMEOUT:60000}              # 유휴 커넥션 유지 시간 (60초)
      max-lifetime: ${DATABASE_MAX_LIFETIME:1800000}            # 커넥션 최대 수명 (30분)                       # 자동 커밋 활성화
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 30
  elasticsearch:
    uris: ${ELASTIC_SEARCH_URL}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000ms}
  cache:
    type: redis
  batch:
    jdbc:
      initialize-schema: never

logging:
  level:
    com.homesweet.homesweetback: ERROR

# 알림 비동기
notification:
  async:
    corePoolSize: ${NOTIFICATION_ASYNC_CORE_POOL_SIZE:5}
    maxPoolSize: ${NOTIFICATION_ASYNC_MAX_POOL_SIZE:10}
    queueCapacity: ${NOTIFICATION_ASYNC_QUEUE_CAPACITY:100}
# 프로덕션 환경 애플리케이션 설정
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/login/callback}
    redirect-uri-on-register: ${APP_OAUTH2_REDIRECT_URI_ON_REGISTER:http://localhost:3000/signup/callback}
# 프로덕션 환경 쿠키 설정
cookie:
  secure: ${COOKIE_SECURE:true}
  
# JWT 프로덕션 설정 (보안 강화)
jwt:
  secret: ${JWT_SECRET}  # 필수 환경 변수
  access-token-expiration: 1800000   # 30분 (프로덕션에서는 짧게)
  refresh-token-expiration: 604800000 # 7일

payments:
  toss:
    secretKey: ${TOSS_PAYMENTS_SECRET_KEY:example-secret-key}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: homesweet-back
  prometheus:
    metrics:
      export:
        enabled: true