services:
  # Prometheus - 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: homesweet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'  # k6 Remote Write 활성화
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped

  # Grafana - 시각화 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: homesweet-grafana
    ports:
      - "3001:3000"  # 3000 포트는 프론트엔드에서 사용중이므로 3001 사용
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Jaeger - 분산 트레이싱
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: homesweet-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
      - "4317:4317"    # OTLP gRPC receiver (옵션)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped

  # Node Exporter - 시스템 메트릭 (CPU, 메모리, 디스크, 네트워크 등)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: homesweet-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped

  # cAdvisor - 컨테이너 메트릭 (Docker 컨테이너 리소스 사용량)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: homesweet-cadvisor
    ports:
      - "8081:8080"  # 8080 포트는 Spring Boot에서 사용중이므로 8081 사용
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg

  # Loki - 로그 수집 및 저장
  loki:
    image: grafana/loki:latest
    container_name: homesweet-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped

  # Promtail - Loki로 로그 전송 (애플리케이션 로그 수집)
  promtail:
    image: grafana/promtail:latest
    container_name: homesweet-promtail
    volumes:
      - ./logs:/var/log/homesweet:ro  # Spring Boot 로그 디렉토리
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped
    depends_on:
      - loki

  # MySQL Exporter - MySQL 메트릭 수집
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: homesweet-mysql-exporter
    command:
      - "--mysqld.username=user:password"
      - "--mysqld.address=homesweet-db:3306"
    ports:
      - "9104:9104"
    networks:
      - monitoring
      - homesweet-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
  homesweet-network:
    name: homesweethome-backend_homesweet-network
    external: true  # docker-compose.dev.yml에서 생성된 네트워크 사용

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
