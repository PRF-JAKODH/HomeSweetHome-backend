global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['16.184.29.177:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['16.184.29.177:9100']

  - job_name: 'mysqld_exporter'
    static_configs:
      - targets: ['16.184.29.177:9104']

  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['16.184.29.177:8080']